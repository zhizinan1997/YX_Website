services:
  website:
    build: .
    container_name: yx-website
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      # Admin 新闻/产品页会直接写入 pages 目录；不挂载会在重建容器后丢失
      - ./pages:/app/pages
      # CDN 静态资源挂载到宿主机，便于直接更新图片/视频文件
      - ./cdn_assets:/app/cdn_assets
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_WEAK_ADMIN_PASSWORDS=${ALLOW_WEAK_ADMIN_PASSWORDS:-false}
      # 可选：容器启动时的 CDN 默认值（后台可覆盖）
      - CDN_ENABLED=${CDN_ENABLED:-false}
      - CDN_DOMAIN=${CDN_DOMAIN:-}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-false}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: yx-gateway
    depends_on:
      - website
    ports:
      # 主站入口
      - "${MAIN_PORT:-2026}:80"
      # CDN 专用入口（仅放行 /cdn_assets/*）
      - "${CDN_PORT:-2027}:81"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
