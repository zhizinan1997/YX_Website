<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线招聘 - 元芯传感</title>
    <link rel="stylesheet" href="templates/lqgd/css/vaisala-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Shared Styles */
        .vs-nav__item--has-mega { position: relative !important; }
        .vs-mega-menu {
            position: absolute; top: 100%; left: -30px; width: 1000px;
            background: var(--color-white); box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 999; display: flex; min-height: 440px; border-radius: 8px;
            overflow: visible; pointer-events: none; border: 1px solid rgba(0,0,0,0.05); margin-top: -2px;
        }
        .vs-nav__item--has-mega:hover .vs-mega-menu { opacity: 1; visibility: visible; pointer-events: auto; }
        .vs-mega-sidebar { width: 260px; background: #f4f6f8; border-right: 1px solid #eee; padding: 15px 0; border-radius: 8px 0 0 8px; }
        .vs-mega-tab { padding: 14px 30px; font-size: 15px; font-weight: 600; color: #444; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
        .vs-mega-tab:hover, .vs-mega-tab.active { background: var(--color-primary); color: var(--color-white); }
        .vs-mega-content { flex: 1; padding: 40px 50px; background: var(--color-white); border-radius: 0 8px 8px 0; }
        .vs-mega-panel { display: none; }
        .vs-mega-panel.active { display: block; }

        .vs-mega-menu--contact { width: 480px; left: -30px; min-height: 280px; }
        .vs-mega-menu--contact .vs-mega-sidebar { width: 180px; }

        /* Page Specific */
        .jobs-container { padding: 80px 0; background: white; }
        .jobs-wrapper { border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.06); border: 1px solid #eee; }
    </style>
</head>

<body>
    <header class="vs-header">
        <div class="vs-container vs-header__inner">
            <div style="display: flex; align-items: center;">
                <a href="index.html" class="vs-logo">
                    <img src="templates/lqgd/images/logo.png" alt="Metachip Logo" style="filter: brightness(0) invert(1);">
                    METACHIP
                </a>
            </div>
            <nav class="vs-nav">
                <ul class="vs-nav__list">
                    <li class="vs-nav__item"><a href="#" class="vs-nav__link">产品</a></li>
                    <li class="vs-nav__item"><a href="hydrogen-solutions.html" class="vs-nav__link">解决方案</a></li>
                    <li class="vs-nav__item"><a href="#" class="vs-nav__link">服务案例</a></li>
                    <li class="vs-nav__item"><a href="#" class="vs-nav__link">公司简介</a></li>
                    <li class="vs-nav__item"><a href="#" class="vs-nav__link">线上店铺</a></li>
                    <li class="vs-nav__item vs-nav__item--has-mega">
                        <a href="contact.aspx_page_contact.html" class="vs-nav__link">联系我们</a>
                        <div class="vs-mega-menu vs-mega-menu--contact">
                            <div class="vs-mega-sidebar">
                                <div class="vs-mega-tab active" onmouseover="showPanelContact('join', this)">加入我们 <i class="fas fa-chevron-right"></i></div>
                                <div class="vs-mega-tab" onmouseover="showPanelContact('contact', this)">联系方式 <i class="fas fa-chevron-right"></i></div>
                            </div>
                            <div class="vs-mega-content">
                                <div id="panel-contact-join" class="vs-mega-panel active">
                                    <h3>加入我们</h3>
                                    <ul class="vs-mega-list-v2" style="list-style: none;">
                                        <li><a href="rlzy.aspx_page_hzzm.html" style="color: #333; font-size: 14px;">合作招募</a></li>
                                        <li><a href="rlzy.aspx_page_jskj.html" style="color: #333; font-size: 14px;">成长空间</a></li>
                                        <li><a href="rlzy.aspx_page_rcln.html" style="color: #333; font-size: 14px;">人才理念</a></li>
                                        <li><a href="jobs.aspx_category_id_0.html" style="color: #333; font-size: 14px;">在线招聘</a></li>
                                    </ul>
                                </div>
                                <div id="panel-contact-contact" class="vs-mega-panel">
                                    <h3>联系方式</h3>
                                    <ul class="vs-mega-list-v2" style="list-style: none;">
                                        <li><a href="contact.aspx_page_contact.html" style="color: #333; font-size: 14px;">联系我们</a></li>
                                        <li><a href="feedbook.aspx.html" style="color: #333; font-size: 14px;">在线留言</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="padding-top: 90px;">
        <section class="vs-hero" style="height: 35vh; min-height: 250px; display: flex; align-items: center; background: #003366;">
            <div class="vs-container" style="text-align: center; color: white;">
                <h1 style="font-size: 40px; font-weight: 700;">人才招聘</h1>
                <p style="font-size: 18px; margin-top: 10px; opacity: 0.8;">加入元芯传感，开启您的职业新纪元。</p>
            </div>
        </section>

        <section class="jobs-container">
            <div class="vs-container">
                <div class="jobs-wrapper">
                    <iframe id="jobs" name="jobs" src="job.aspx.html" width="100%" height="800px" frameborder="0" scrolling="no"></iframe>
                </div>
            </div>
        </section>
    </main>

    <footer class="vs-footer" style="background: #001e3e; color: white; padding: 40px 0; text-align: center;">
        <p style="opacity: 0.5; font-size: 13px;">Copyright © 2023 湖南元芯传感科技有限责任公司</p>
    </footer>

    <script>
        function showPanelContact(panelId, tab) {
            const menu = tab.closest('.vs-mega-menu');
            menu.querySelectorAll('.vs-mega-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            menu.querySelectorAll('.vs-mega-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-contact-' + panelId).classList.add('active');
        }
    </script>
</body>
</html>
