<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>元芯传感主站监测</title>
  <link rel="stylesheet" href="/static/check.css?v=response-latency-1">
</head>
<body class="check-public">
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/">
        <span class="brand__logo">
          <img src="/static/images/metachip-logo.png" alt="元芯传感标识">
        </span>
        <span>
          <strong>元芯传感</strong>
          <small>主站可访问性监测</small>
        </span>
      </a>
      <nav class="site-nav">
        <a href="https://www.hnmetachip.cn/">主站</a>
        <a href="/admin">后台</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero-band">
      <div class="vs-container hero-band__inner">
        <div>
          <p class="eyebrow">独立监测站</p>
          <h1>元芯传感官网实时健康状态</h1>
          <p class="hero-copy">每小时通过真实浏览器访问关键页面，记录页面可访问性、关键同域资源状态与响应延迟。</p>
        </div>
        <div class="hero-status" id="overallStatus">
          <span class="status-dot status-dot--pending"></span>
          <strong>加载中</strong>
          <small>正在读取最近 24 小时状态</small>
        </div>
      </div>
    </section>

    <section class="vs-container dashboard-grid">
      <article class="metric-card">
        <span>监测目标</span>
        <strong id="metricTargets">-</strong>
      </article>
      <article class="metric-card">
        <span>正常目标</span>
        <strong id="metricOk">-</strong>
      </article>
      <article class="metric-card">
        <span>平均响应延迟</span>
        <strong id="metricLatency">-</strong>
      </article>
      <article class="metric-card">
        <span>活跃异常</span>
        <strong id="metricIncidents">-</strong>
      </article>
    </section>

    <section class="vs-container section-block">
      <div class="section-heading">
        <div>
          <p class="eyebrow">二十四小时状态</p>
          <h2>关键页面可访问状态</h2>
        </div>
        <span id="lastUpdated" class="muted">-</span>
      </div>
      <div id="targetList" class="target-list loading-block">正在加载监测数据...</div>
    </section>

    <section class="vs-container section-block">
      <div class="section-heading">
        <div>
          <p class="eyebrow">异常记录</p>
          <h2>最近异常记录</h2>
        </div>
      </div>
      <div id="incidentList" class="incident-list loading-block">正在加载异常记录...</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="vs-container">
      <strong>湖南元芯传感科技有限责任公司</strong>
      <span>由独立监测容器提供主站可访问性检测服务。</span>
    </div>
  </footer>
  <script src="/static/dashboard.js?v=clock-hour-timeline-1"></script>
</body>
</html>
