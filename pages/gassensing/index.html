                <script>
                    (function () {
                        const baseVideo = document.getElementById('h2HeroVideo');
                        if (!baseVideo) return;

                        const TARGET_OPACITY = '0.85';
                        const READY_TIMEOUT_MS = 12000;
                        const PLAY_TIMEOUT_MS = 5000;

                        function styleHeroVideo(el, visible) {
                            el.muted = true;
                            el.playsInline = true;
                            el.preload = 'auto';
                            el.setAttribute('muted', '');
                            el.setAttribute('playsinline', '');
                            el.style.position = 'absolute';
                            el.style.top = '0';
                            el.style.left = '0';
                            el.style.width = '100%';
                            el.style.height = '100%';
                            el.style.objectFit = 'cover';
                            el.style.zIndex = '0';
                            el.style.pointerEvents = 'none';
                            el.style.opacity = visible ? TARGET_OPACITY : '0';
                            el.style.visibility = visible ? 'visible' : 'hidden';
                            el.style.transition = 'none';
                            el.style.backgroundColor = 'transparent';
                        }

                        function showVideo(video) {
                            video.style.visibility = 'visible';
                            video.style.opacity = TARGET_OPACITY;
                        }

                        function hideVideo(video) {
                            video.style.opacity = '0';
                            video.style.visibility = 'hidden';
                        }

                        styleHeroVideo(baseVideo, false);
                        const standbyVideo = document.createElement('video');
                        standbyVideo.id = 'h2HeroVideoStandby';
                        styleHeroVideo(standbyVideo, false);
                        baseVideo.insertAdjacentElement('afterend', standbyVideo);

                        let playlist = [];
                        let activeIndex = 0;
                        let activeVideo = baseVideo;
                        let nextVideo = standbyVideo;
                        let switching = false;
                        let preparedIndex = -1;
                        let retryTimer = null;

                        function clearRetry() {
                            if (!retryTimer) return;
                            clearTimeout(retryTimer);
                            retryTimer = null;
                        }

                        function scheduleRetry(targetIndex) {
                            clearRetry();
                            retryTimer = setTimeout(() => {
                                retryTimer = null;
                                if (!playlist.length) return;
                                const expected = (activeIndex + 1) % playlist.length;
                                const safeTarget = targetIndex === expected ? targetIndex : expected;
                                switchToIndex(safeTarget).catch(() => { });
                            }, 350);
                        }

                        function toVideoFetchUrl(rawUrl) {
                            const absolute = new URL(rawUrl, window.location.origin);
                            return absolute.href;
                        }

                        function waitForPlayable(video, timeoutMs = READY_TIMEOUT_MS) {
                            return new Promise(resolve => {
                                if (!video) {
                                    resolve(false);
                                    return;
                                }
                                if (video.readyState >= 3) {
                                    resolve(true);
                                    return;
                                }

                                let done = false;
                                const finish = (ok) => {
                                    if (done) return;
                                    done = true;
                                    clearTimeout(timerId);
                                    resolve(ok);
                                };

                                const timerId = setTimeout(() => finish(false), timeoutMs);
                                video.addEventListener('loadeddata', () => finish(true), { once: true });
                                video.addEventListener('canplay', () => finish(true), { once: true });
                                video.addEventListener('error', () => finish(false), { once: true });
                            });
                        }

                        function waitForPlaybackStart(video, timeoutMs = PLAY_TIMEOUT_MS) {
                            return new Promise(resolve => {
                                if (!video) {
                                    resolve(false);
                                    return;
                                }

                                let done = false;
                                const finish = (ok) => {
                                    if (done) return;
                                    done = true;
                                    clearTimeout(timerId);
                                    resolve(ok);
                                };

                                const timerId = setTimeout(() => finish(false), timeoutMs);
                                const onSuccess = () => finish(true);

                                video.addEventListener('playing', onSuccess, { once: true });
                                video.addEventListener('timeupdate', onSuccess, { once: true });
                                video.addEventListener('error', () => finish(false), { once: true });

                                if (typeof video.requestVideoFrameCallback === 'function') {
                                    try {
                                        video.requestVideoFrameCallback(() => finish(true));
                                    } catch (_) { }
                                }

                                try {
                                    const playPromise = video.play();
                                    if (playPromise && typeof playPromise.catch === 'function') {
                                        playPromise.catch(() => { });
                                    }
                                } catch (_) { }

                                if (!video.paused && video.readyState >= 2) {
                                    requestAnimationFrame(() => finish(true));
                                }
                            });
                        }

                        function setVideoSource(video, idx) {
                            if (!playlist.length) return false;
                            const item = playlist[idx];
                            if (!item || !item.url) return false;
                            const src = toVideoFetchUrl(item.url);
                            if (video.dataset.src === src) return true;
                            video.dataset.src = src;
                            video.src = src;
                            video.load();
                            return true;
                        }

                        async function ensurePrepared(idx) {
                            if (!playlist.length) return false;
                            if (preparedIndex === idx && nextVideo.readyState >= 2) return true;
                            if (!setVideoSource(nextVideo, idx)) return false;
                            const ready = await waitForPlayable(nextVideo);
                            preparedIndex = ready ? idx : -1;
                            return ready;
                        }

                        async function prepareNextFrom(index) {
                            if (playlist.length <= 1) return true;
                            const nextIndex = (index + 1) % playlist.length;
                            return ensurePrepared(nextIndex);
                        }

                        async function switchToIndex(targetIndex) {
                            if (switching || playlist.length <= 1) return;
                            switching = true;
                            try {
                                const expected = (activeIndex + 1) % playlist.length;
                                const safeTarget = targetIndex === expected ? targetIndex : expected;
                                const ready = await ensurePrepared(safeTarget);
                                if (!ready) {
                                    scheduleRetry(safeTarget);
                                    return;
                                }

                                const started = await waitForPlaybackStart(nextVideo);
                                if (!started) {
                                    scheduleRetry(safeTarget);
                                    return;
                                }

                                clearRetry();
                                showVideo(nextVideo);
                                hideVideo(activeVideo);
                                activeVideo.pause();
                                activeVideo.currentTime = 0;

                                const previousActive = activeVideo;
                                activeVideo = nextVideo;
                                nextVideo = previousActive;
                                activeIndex = safeTarget;
                                preparedIndex = -1;

                                prepareNextFrom(activeIndex).catch(() => { });
                            } finally {
                                switching = false;
                            }
                        }

                        function onVideoEnded(event) {
                            if (event.target !== activeVideo || !playlist.length) return;
                            if (playlist.length <= 1) {
                                activeVideo.currentTime = 0;
                                waitForPlaybackStart(activeVideo).then(ok => {
                                    if (ok) showVideo(activeVideo);
                                }).catch(() => { });
                                return;
                            }
                            const targetIndex = (activeIndex + 1) % playlist.length;
                            switchToIndex(targetIndex).catch(() => { });
                        }

                        baseVideo.addEventListener('ended', onVideoEnded);
                        standbyVideo.addEventListener('ended', onVideoEnded);

                        fetch('/api/h2-home')
                            .then(res => res.json())
                            .then(async data => {
                                playlist = (data.items || []).filter(i => i && i.url);
                                if (!playlist.length) return;

                                activeIndex = 0;
                                setVideoSource(activeVideo, activeIndex);
                                const ready = await waitForPlayable(activeVideo);
                                if (!ready) return;
                                activeVideo.currentTime = 0;
                                const started = await waitForPlaybackStart(activeVideo);
                                if (!started) return;
                                showVideo(activeVideo);
                                hideVideo(nextVideo);
                                prepareNextFrom(activeIndex).catch(() => { });
                            })
                            .catch(() => { });
                    })();
                </script>

    <!-- 产品分类下拉菜单交互 -->
    <script>
        (function () {
            let allProducts = [];
            let currentCategory = 'all';
            let defaultProducts = [];
            let industryFilters = [];
            let industryLabelMap = { 'all': '全部产品' };

            const cta = document.getElementById('h2AppsCta');
            const dropdown = document.getElementById('h2AppsDropdown');
            const dropdownList = document.getElementById('h2AppsDropdownList');
            const ctaText = document.getElementById('h2AppsCtaText');
            const productList = document.getElementById('h2AppsProductList');

            if (!cta || !dropdown || !dropdownList || !productList) return;

            // Toggle dropdown
            cta.addEventListener('click', function (e) {
                e.stopPropagation();
                cta.classList.toggle('open');
                dropdown.classList.toggle('active');
            });

            // Close on click outside
            document.addEventListener('click', function () {
                cta.classList.remove('open');
                dropdown.classList.remove('active');
            });

            dropdown.addEventListener('click', function (e) {
                e.stopPropagation();
            });

            // Load products and categories
            async function init() {
                try {
                    const [resAll, resDefault, resIndustry] = await Promise.all([
                        fetch('/api/products/with-settings'),
                        fetch('/api/h2-home/products'),
                        fetch('/api/products/industry-filters')
                    ]);
                    const data = await resAll.json();
                    const defaultData = await resDefault.json();
                    const industryData = await resIndustry.json();
                    // Keep all non-hidden products so industry filters from admin
                    // (including customization/biosensing mappings) can render correctly.
                    allProducts = (data.products || []).filter(p => !p.hidden);
                    defaultProducts = (defaultData.items || []);
                    industryFilters = Array.isArray(industryData.categories) ? industryData.categories : [];

                    industryLabelMap = { 'all': '全部产品' };
                    industryFilters.forEach(item => {
                        if (item && item.key && item.name) {
                            industryLabelMap[item.key] = item.name;
                        }
                    });

                    // Build dropdown menu from admin "领域分类" (show all configured categories)
                    const menuItems = [{ key: 'all', label: '全部产品' }];
                    industryFilters.forEach(item => {
                        if (!item || !item.key || !item.name) return;
                        menuItems.push({ key: item.key, label: item.name });
                    });

                    dropdownList.innerHTML = menuItems.map(item =>
                        `<li><a href="javascript:void(0)" data-filter="${item.key}" class="${item.key === 'all' ? 'active' : ''}">${item.label}</a></li>`
                    ).join('');

                    // Add click handlers
                    dropdownList.querySelectorAll('a[data-filter]').forEach(link => {
                        link.addEventListener('click', function (e) {
                            e.preventDefault();
                            dropdownList.querySelectorAll('a').forEach(a => a.classList.remove('active'));
                            this.classList.add('active');

                            currentCategory = this.dataset.filter;
                            ctaText.textContent = industryLabelMap[currentCategory] || '选择分类';

                            renderProducts();

                            // Close dropdown
                            cta.classList.remove('open');
                            dropdown.classList.remove('active');
                        });
                    });

                    // Initial render
                    renderProducts();
                } catch (err) {
                    console.error('Failed to load products for dropdown:', err);
                }
            }

            function getFilteredProducts() {
                if (currentCategory === 'all') {
                    return defaultProducts.length ? defaultProducts : allProducts;
                }
                return allProducts.filter(p => {
                    const categories = Array.isArray(p.industryCategories) ? p.industryCategories : [];
                    return categories.includes(currentCategory);
                });
            }

            function renderProducts() {
                const filtered = getFilteredProducts();
                const top3 = filtered.slice(0, 3);

                if (top3.length === 0) {
                    productList.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">
                            该分类暂无产品
                        </div>
                    `;
                    return;
                }

                productList.innerHTML = top3.map(p => {
                    let link = p.link || `${p.id}.html`;
                    if (link.startsWith('pages/gassensing/')) {
                        link = link.replace('pages/gassensing/', '');
                    }
                    if (link.startsWith('/pages/gassensing/')) {
                        link = link.replace('/pages/gassensing/', '');
                    }
                    const title = p.shortName || p.name || p.title || '';
                    const desc = p.description || p.desc || '';
                    const image = p.image || '';
                    return `
                    <a href="${link}" class="h2-product">
                        <div class="h2-product__img">
                            <img src="${image}" alt="${title}">
                        </div>
                        <div class="h2-product__title">${title}</div>
                        <div class="h2-product__desc">${desc}</div>
                        <span class="h2-product__link">查看产品</span>
                    </a>
                `;
                }).join('');
            }

            init();
        })();
    </script>
