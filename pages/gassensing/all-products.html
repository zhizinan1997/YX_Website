    <!-- 动态产品菜单（从API自动加载，支持自定义名称和新品标记） -->
    <script>
        // 从 API 自动获取产品列表并生成菜单
        document.addEventListener('DOMContentLoaded', async function () {
            const container = document.getElementById('dynamic-product-list');
            if (!container) return;

            try {
                // 使用带设置的 API 获取自定义名称和新品标记
                const response = await fetch('/api/products/with-settings');
                const data = await response.json();

                if (!data.products || data.products.length === 0) {
                    container.innerHTML = '<p style="color:#666;">暂无产品</p>';
                    return;
                }

                // 过滤掉定制服务和隐藏的产品
                const menuProducts = data.products.filter(p => !p.id.includes('../') && !p.hidden);

                // 生成产品链接（使用自定义名称，显示新品标记）
                const createProductLink = (p) => {
                    const displayName = p.displayName || p.shortName || p.name;
                    const newBadge = p.isNew ? '<span style="background:#ff4444;color:white;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:5px;vertical-align:middle;">NEW</span>' : '';
                    return `<li><a href="../gassensing/${p.id}.html">${displayName}${newBadge}</a></li>`;
                };

                // 分两列显示
                const half = Math.ceil(menuProducts.length / 2);
                const leftProducts = menuProducts.slice(0, half);
                const rightProducts = menuProducts.slice(half);

                const leftHtml = leftProducts.map(createProductLink).join('');
                const rightHtml = rightProducts.map(createProductLink).join('');

                container.innerHTML = `
                    <div><ul class="vs-mega-list-v2">${leftHtml}</ul></div>
                    <div><ul class="vs-mega-list-v2">${rightHtml}</ul></div>
                `;
            } catch (error) {
                console.error('Failed to load products:', error);
                container.innerHTML = '<p style="color:#666;">加载产品列表失败</p>';
            }
        });
    </script>

    <!-- 动态加载新品推荐 -->
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const res = await fetch('/api/recommendations');
                const data = await res.json();
                const buildRecommendationLink = (item) => {
                    const url = (item && item.url) ? String(item.url) : '#';
                    const name = (item && item.name) ? String(item.name) : '未命名链接';
                    const external = /^https?:\/\//i.test(url);
                    const target = external ? ' target="_blank" rel="noopener noreferrer"' : '';
                    return `<li><a href="${url}"${target}>${name}</a></li>`;
                };

                // 填充最新发布
                const latestList = document.getElementById('latestReleasesList');
                if (latestList && data.latestReleases) {
                    latestList.innerHTML = data.latestReleases.map(buildRecommendationLink).join('');
                }

                // 填充应用领域
                const appList = document.getElementById('applicationAreasList');
                if (appList && data.applicationAreas) {
                    appList.innerHTML = data.applicationAreas.map(buildRecommendationLink).join('');
                }
            } catch (e) {
                console.error('Failed to load recommendations:', e);
            }
        });
    </script>

    <!-- 动态加载产品种类 -->
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const res = await fetch('/api/categories');
                const data = await res.json();

                if (data.categories && data.categories.length > 0) {
                    // 分两列显示
                    const half = Math.ceil(data.categories.length / 2);
                    const leftCategories = data.categories.slice(0, half);
                    const rightCategories = data.categories.slice(half);

                    const leftList = document.getElementById('categoriesLeft');
                    const rightList = document.getElementById('categoriesRight');

                    if (leftList) {
                        leftList.innerHTML = leftCategories.map(cat =>
                            `<li><a href="${cat.url}">${cat.name}</a></li>`
                        ).join('');
                    }

                    if (rightList) {
                        rightList.innerHTML = rightCategories.map(cat =>
                            `<li><a href="${cat.url}">${cat.name}</a></li>`
                        ).join('');
                    }
                }
            } catch (e) {
                console.error('Failed to load categories:', e);
            }
        });
    </script>
