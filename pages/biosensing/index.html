<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../../assets/css/yx-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Product List Page Styles */
        .vs-page-hero {
            background: linear-gradient(135deg, rgba(0, 50, 100, 0.15) 0%, rgba(0, 30, 60, 0.55) 100%),
                url('/cdn_assets/images/common/0c472175cfb3.png');
            background-size: cover;
            background-position: center;
            padding: 120px 0 60px;
            color: white;
            text-align: center;
        }

        .vs-page-hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .vs-page-hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        .vs-breadcrumb {
            padding: 15px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: left;
        }

        .vs-breadcrumb a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        .vs-breadcrumb a:hover {
            color: white;
        }

        .vs-breadcrumb span {
            margin: 0 10px;
            opacity: 0.6;
        }

        /* Category Navigation */
        .vs-category-nav {
            background: #f8fafc;
            border-bottom: 1px solid #e0e0e0;
            padding: 0;
        }

        .vs-category-nav ul {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            padding: 0;
            margin: 0;
            justify-content: center;
            gap: 8px;
            padding: 20px 0;
        }

        .vs-category-nav li a {
            display: inline-block;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .vs-category-nav li a:hover,
        .vs-category-nav li a.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* Product Grid */
        .vs-products-section {
            padding: 60px 0;
        }

        .vs-products-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .vs-products-header h2 {
            font-size: 32px;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 8px;
        }

        .vs-products-header p {
            color: #666;
            font-size: 16px;
        }

        .vs-products-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        @media (max-width: 992px) {
            .vs-products-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .vs-products-list {
                grid-template-columns: 1fr;
            }

            .vs-page-hero h1 {
                font-size: 32px;
            }
        }

        .vs-products-list>li {
            margin: 0;
        }

        .vs-products-list>li>a {
            display: block;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .vs-products-list>li>a:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .vs-product-img {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 20px;
            overflow: hidden;
        }

        .vs-product-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .vs-product-info {
            padding: 24px;
        }

        .vs-product-info h5 {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .vs-product-info p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .vs-product-more {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
        }

        .vs-product-more::after {
            content: '→';
            transition: transform 0.2s;
        }

        .vs-products-list>li>a:hover .vs-product-more::after {
            transform: translateX(4px);
        }

        /* Pagination */
        .vs-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 48px;
            flex-wrap: wrap;
        }

        .vs-pagination span,
        .vs-pagination a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .vs-pagination a {
            background: white;
            color: #555;
            border: 1px solid #e0e0e0;
            text-decoration: none;
        }

        .vs-pagination a:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .vs-pagination .current {
            background: var(--color-primary);
            color: white;
        }

        .vs-pagination .disabled {
            color: #aaa;
            cursor: not-allowed;
        }

        /* Phone layout: compact scan-friendly cards without affecting tablet/desktop. */
        @media (max-width: 640px) {
            main {
                padding-top: 72px !important;
            }

            .vs-page-hero {
                padding: 72px 0 34px;
            }

            .vs-breadcrumb {
                display: none;
            }

            .vs-page-hero h1 {
                font-size: 30px;
                line-height: 1.25;
                margin-bottom: 8px;
            }

            .vs-page-hero p {
                max-width: 24em;
                margin: 0 auto;
                font-size: 14px;
                line-height: 1.55;
            }

            .vs-category-nav {
                position: sticky;
                top: 64px;
                z-index: 20;
                background: rgba(248, 250, 252, 0.96);
                border-bottom-color: #e5edf7;
                box-shadow: 0 8px 18px rgba(15, 45, 90, 0.06);
                backdrop-filter: blur(10px);
            }

            .vs-category-nav .vs-container {
                max-width: 100%;
                padding-left: 16px;
                padding-right: 16px;
                overflow: hidden;
            }

            .vs-category-nav ul {
                flex-wrap: nowrap;
                justify-content: flex-start;
                gap: 8px;
                padding: 12px 0;
                overflow-x: auto;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
            }

            .vs-category-nav ul::-webkit-scrollbar {
                display: none;
            }

            .vs-category-nav li {
                flex: 0 0 auto;
            }

            .vs-category-nav li a {
                padding: 8px 14px;
                border-color: #dbe6f2;
                border-radius: 999px;
                color: #52657a;
                font-size: 13px;
                line-height: 1.2;
                white-space: nowrap;
                box-shadow: 0 2px 8px rgba(15, 45, 90, 0.05);
            }

            .vs-products-section {
                padding: 28px 0 42px;
            }

            .vs-products-header {
                margin-bottom: 18px;
            }

            .vs-products-header h2 {
                font-size: 24px;
                line-height: 1.25;
                margin-bottom: 6px;
            }

            .vs-products-header p {
                font-size: 13px;
            }

            .vs-products-list {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .vs-products-list>li>a {
                display: grid;
                grid-template-columns: 108px minmax(0, 1fr);
                column-gap: 12px;
                align-items: stretch;
                min-height: 128px;
                padding: 10px;
                border: 1px solid #dce6f2;
                border-radius: 12px;
                box-shadow: 0 3px 12px rgba(17, 54, 96, 0.08);
            }

            .vs-products-list>li>a:hover {
                transform: none;
                box-shadow: 0 3px 12px rgba(17, 54, 96, 0.08);
            }

            .vs-product-img {
                width: 108px;
                height: 108px;
                padding: 8px;
                border-radius: 10px;
                box-sizing: border-box;
            }

            .vs-product-info {
                min-width: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }

            .vs-product-info h5 {
                margin: 0;
                color: #0066cc;
                font-size: 15px;
                line-height: 1.35;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .vs-product-info p {
                margin: 6px 0 8px;
                color: #5d6b7c;
                font-size: 12.5px;
                line-height: 1.5;
                -webkit-line-clamp: 2;
                line-clamp: 2;
            }

            .vs-product-more {
                align-self: flex-start;
                margin-top: auto;
                padding: 5px 10px;
                border: 1px solid rgba(0, 102, 204, 0.22);
                border-radius: 999px;
                background: rgba(0, 102, 204, 0.05);
                font-size: 12px;
                line-height: 1.2;
                white-space: nowrap;
            }

            .vs-pagination {
                gap: 6px;
                margin-top: 26px;
            }

            .vs-pagination span,
            .vs-pagination a {
                min-width: 36px;
                height: 36px;
                padding: 0 10px;
                font-size: 13px;
            }

            .vs-pagination>span:first-child {
                flex-basis: 100%;
                height: auto;
                margin-bottom: 2px;
                color: #64748b;
            }
        }

        @media (max-width: 390px) {
            .vs-products-list>li>a {
                grid-template-columns: 100px minmax(0, 1fr);
                column-gap: 10px;
                min-height: 120px;
            }

            .vs-product-img {
                width: 100px;
                height: 100px;
                padding: 7px;
            }

            .vs-product-info h5 {
                font-size: 14.5px;
            }
        }
    </style>
