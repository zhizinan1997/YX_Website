    <style>
        /* Product List Page Styles */
        .vs-page-hero {
            background: linear-gradient(135deg, rgba(0, 50, 100, 0.15) 0%, rgba(0, 30, 60, 0.55) 100%),
                url('/cdn_assets/images/common/0c472175cfb3.png');
            background-size: cover;
            background-position: center;
            padding: 120px 0 60px;
            color: white;
            text-align: center;
        }

        .vs-page-hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .vs-page-hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        .vs-breadcrumb {
            padding: 15px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: left;
        }

        .vs-breadcrumb a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        .vs-breadcrumb a:hover {
            color: white;
        }

        .vs-breadcrumb span {
            margin: 0 10px;
            opacity: 0.6;
        }

        /* Category Navigation */
        .vs-category-nav {
            background: #f8fafc;
            border-bottom: 1px solid #e0e0e0;
            padding: 0;
        }

        .vs-category-nav ul {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            padding: 0;
            margin: 0;
            justify-content: center;
            gap: 8px;
            padding: 20px 0;
        }

        .vs-category-nav li a {
            display: inline-block;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .vs-category-nav li a:hover,
        .vs-category-nav li a.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* Product Grid */
        .vs-products-section {
            padding: 60px 0;
        }

        .vs-products-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .vs-products-header h2 {
            font-size: 32px;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 8px;
        }

        .vs-products-header p {
            color: #666;
            font-size: 16px;
        }

        .vs-products-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        @media (max-width: 992px) {
            .vs-products-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .vs-products-list {
                grid-template-columns: 1fr;
            }

            .vs-page-hero h1 {
                font-size: 32px;
            }
        }

        .vs-products-list>li {
            margin: 0;
        }

        .vs-products-list>li>a {
            display: block;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .vs-products-list>li>a:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .vs-product-img {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 20px;
            overflow: hidden;
        }

        .vs-product-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .vs-product-info {
            padding: 24px;
        }

        .vs-product-info h5 {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .vs-product-info p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .vs-product-more {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
        }

        .vs-product-more::after {
            content: '→';
            transition: transform 0.2s;
        }

        .vs-products-list>li>a:hover .vs-product-more::after {
            transform: translateX(4px);
        }

        /* Pagination */
        .vs-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 48px;
            flex-wrap: wrap;
        }

        .vs-pagination span,
        .vs-pagination a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .vs-pagination a {
            background: white;
            color: #555;
            border: 1px solid #e0e0e0;
            text-decoration: none;
        }

        .vs-pagination a:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .vs-pagination .current {
            background: var(--color-primary);
            color: white;
        }

        .vs-pagination .disabled {
            color: #aaa;
            cursor: not-allowed;
        }
    </style>
