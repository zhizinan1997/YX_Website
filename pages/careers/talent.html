<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人才理念 - 元芯传感</title>
    <link rel="stylesheet" href="../../assets/css/yx-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/search.css">

    <style>
        :root {
            /* Premium Light Theme */
            --mc-bg-main: #ffffff;
            --mc-bg-alt: #f8fafc;
            --mc-primary: #0056b3;
            --mc-secondary: #00a8e8;
            --mc-accent: #0f172a;

            --mc-text-head: #0f172a;
            --mc-text-body: #334155;
            --mc-text-light: #64748b;

            --mc-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --mc-shadow-hover: 0 20px 40px -5px rgba(0, 0, 0, 0.1);

            --font-main: 'Manrope', sans-serif;
        }

        body {
            font-family: var(--font-main);
            color: var(--mc-text-body);
            background: var(--mc-bg-main);
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4,
        p {
            margin: 0;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: .3s;
        }

        /* --- Animations --- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal {
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        /* --- Hero Section --- */
        .hero {
            position: relative;
            height: 60vh;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #001e3e;
            color: #fff;
            text-align: center;
        }

        .hero__video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        video::-webkit-media-controls {
            display: none !important;
        }
        video::-webkit-media-controls-enclosure {
            display: none !important;
        }

        .hero__content {
            position: relative;
            z-index: 10;
            padding: 0 24px;
            max-width: 800px;
        }

        .hero__title {
            font-size: clamp(40px, 5vw, 64px);
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero__subtitle {
            font-size: clamp(20px, 2.5vw, 24px);
            font-weight: 300;
            opacity: 0.9;
        }

        /* --- Concept Section --- */
        .concept-section {
            padding: 100px 0;
            background: var(--mc-bg-alt);
        }

        .container {
            width: min(1200px, 92vw);
            margin: 0 auto;
        }

        .concept-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .concept-card {
            background: #fff;
            padding: 32px;
            border-radius: 20px;
            box-shadow: var(--mc-shadow);
            transition: .4s;
            border: 1px solid rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .concept-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--mc-shadow-hover);
        }

        .concept-card__icon {
            font-size: 32px;
            color: var(--mc-primary);
            margin-bottom: 24px;
            width: 64px;
            height: 64px;
            background: #eff6ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .concept-card__title {
            display: inline-block;
            font-size: 24px;
            font-weight: 800;
            color: var(--mc-text-head);
            margin-bottom: 16px;
            position: relative;
        }

        .concept-card__highlight {
            font-size: 18px;
            font-weight: 700;
            color: var(--mc-primary);
            margin-bottom: 12px;
        }

        .concept-card__desc {
            font-size: 16px;
            line-height: 1.7;
            color: var(--mc-text-light);
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .concept-image-box {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-top: auto;
        }

        .concept-image-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            transition: .6s;
        }

        .concept-card:hover .concept-image-box img {
            transform: scale(1.05);
        }

        .concept-caption {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--mc-primary);
            text-align: center;
        }

        @media (max-width: 1024px) {
            .concept-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <div id="mc-nav-root" data-nav-profile="home"></div>
    <script src="/assets/js/nav-loader.js?v=20260604i"></script>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <video id="heroVideo" class="hero__video" muted loop playsinline autoplay preload="metadata">
                <source src="/cdn_assets/videos/renwen.mp4" type="video/mp4" />
            </video>

            <div class="hero__content reveal">
                <h1 class="hero__title">人才理念</h1>
                <p class="hero__subtitle">志同道合，元芯共图。发现你的不凡，成就共同的卓越。</p>
            </div>
        </section>

        <!-- Concept Grid -->
        <section class="concept-section">
            <div class="container">
                <div class="concept-grid">
                    <!-- Card 1: Recruitment -->
                    <div class="concept-card reveal">
                        <div class="concept-card__icon"><i class="fas fa-search"></i></div>
                        <h3 class="concept-card__title">求人观</h3>
                        <div class="concept-card__highlight">"能力主义" 而非 "学历主义"</div>
                        <p class="concept-card__desc">有能力又有责任心的员工是杰出员工，有能力而没有责任心的员工是不合格的员工。我们看重真实解决问题的能力。</p>
                        <div class="concept-image-box">
                            <img src="/cdn_assets/images/about/9e37df780e92.webp" alt="专业能力">
                            <div class="concept-caption">一流的科研环境，广阔的施展空间</div>
                        </div>
                    </div>

                    <!-- Card 2: Usage -->
                    <div class="concept-card reveal delay-100">
                        <div class="concept-card__icon"><i class="fas fa-user-check"></i></div>
                        <h3 class="concept-card__title">用人观</h3>
                        <div class="concept-card__highlight">"岗能相宜"</div>
                        <p class="concept-card__desc">岗适其能、人得其位。每个岗位选择适合的人，每个人都能找到适合自己的岗位，发挥最大潜能。</p>
                        <div class="concept-image-box">
                            <img src="/cdn_assets/images/about/88179c184f86.webp" alt="人岗匹配">
                            <div class="concept-caption">深入一线场景，实现自我价值</div>
                        </div>
                    </div>

                    <!-- Card 3: Retention -->
                    <div class="concept-card reveal delay-200">
                        <div class="concept-card__icon"><i class="fas fa-heart"></i></div>
                        <h3 class="concept-card__title">留人观</h3>
                        <div class="concept-card__highlight">"事业、待遇、情感"</div>
                        <p class="concept-card__desc">
                            我们不仅提供一份工作，更提供一个实现自我价值的舞台。通过广阔的事业平台，让每一位优秀人才在元芯扎根成长。
                        </p>
                        <div class="concept-image-box">
                            <img src="/cdn_assets/images/about/b7a9ca5eec5d.webp" alt="元芯团队合照">
                            <div class="concept-caption">温暖的团队氛围，共享发展成果</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Script for Video Fallback/Play -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('heroVideo');
            if (video) {
                video.play().catch(e => console.log("Video autoplay blocked, user interaction needed."));
            }
        });
    </script>

    <script src="../../assets/js/search.js"></script>
    <script src="../../assets/js/chatbot.js?v=20260604i"></script>

    <!-- Footer -->
    <div id="mc-footer-root"></div>
    <script src="/assets/js/footer-loader.js?v=20260415c"></script>
</body>

</html>
