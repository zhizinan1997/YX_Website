<script>
    (function () {
        const list = document.getElementById('jobsList');
        if (!list) return;

        function renderJobs(items) {
            if (!items || items.length === 0) {
                list.innerHTML = '<li><div class="jobs_show"><p class="info_name"><span style="width:100%;">暂无招聘信息</span></p></div></li>';
                return;
            }
            list.innerHTML = items.map((item, idx) => `
                <li>
                    <div class="jobs_show">
                        <p class="info_name">
                            <span style="width:35%;">${idx + 1}、职位名称:&nbsp&nbsp${item.title || ''}</span>
                            <span style="width:20%;">招聘部门:&nbsp&nbsp${item.department || ''}</span>
                            <span style="width:20%;">工作地点:&nbsp&nbsp${item.location || ''}</span>
                            <span style="width:20%;">发布日期:&nbsp&nbsp${item.date || ''}</span>
                        </p>
                    </div>
                    <div class="jobs_hide">
                        <dl class="gwzz">
                            ${item.content_html && item.content_html.includes('<dt') ? item.content_html : '<dt>岗位职责：</dt>' + (item.content_html || '')}
                        </dl>
                        <div class="jobsbook_href">
                            <a href="javascript:;">收起</a>
                        </div>
                    </div>
                </li>
            `).join('');

            if (window.initJobsList) {
                window.initJobsList();
            }
        }

        fetch('/api/jobs/public')
            .then(res => res.json())
            .then(data => renderJobs(data.items || []))
            .catch(() => renderJobs([]));
    })();
</script>
