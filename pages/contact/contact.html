    <style>
        /* Compact Inficon-style Mega Menu - Identical to main page */
        .vs-header .vs-container,
        .vs-header__inner,
        .vs-nav,
        .vs-nav__list {
            height: 100%;
        }

        .vs-nav__item--has-mega {
            position: relative !important;
        }

        .vs-mega-menu {
            position: absolute;
            top: 100%;
            left: -30px;
            width: 1000px;
            background: var(--color-white);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 999;
            display: flex;
            min-height: 440px;
            border-radius: 8px;
            overflow: visible;
            pointer-events: none;
            border: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: -2px;
        }

        .vs-mega-menu::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -50px;
            width: 400px;
            height: 50px;
            background: transparent;
            z-index: -1;
        }

        .vs-nav__item--has-mega:hover .vs-mega-menu {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .vs-mega-sidebar {
            width: 260px;
            background: #f4f6f8;
            border-right: 1px solid #eee;
            padding: 15px 0;
            border-radius: 8px 0 0 8px;
        }

        .vs-mega-tab {
            padding: 14px 30px;
            font-size: 15px;
            font-weight: 600;
            color: #444;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .vs-mega-tab:first-child {
            border-top-left-radius: 8px;
        }

        .vs-mega-tab:hover,
        .vs-mega-tab.active {
            background: var(--color-primary);
            color: var(--color-white);
        }

        .vs-mega-tab i {
            font-size: 10px;
            opacity: 0.4;
        }

        .vs-mega-content {
            flex: 1;
            padding: 40px 50px;
            background: var(--color-white);
            border-radius: 0 8px 8px 0;
        }

        .vs-mega-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .vs-mega-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vs-mega-panel h3 {
            font-size: 20px;
            color: var(--color-primary);
            margin-bottom: 24px;
            font-weight: 700;
            border-bottom: 2px solid var(--color-accent-orange);
            display: inline-block;
            padding-bottom: 4px;
        }

        .vs-mega-grid-v2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .vs-mega-sublist-title {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            display: block;
        }

        .vs-mega-list-v2 {
            list-style: none;
        }

        .vs-mega-list-v2 li {
            margin-bottom: 10px;
        }

        .vs-mega-list-v2 a {
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
        }

        .vs-mega-list-v2 a:hover {
            color: var(--color-accent-blue);
            padding-left: 5px;
        }

        .vs-mega-action {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .vs-btn-search {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
            font-weight: 600;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .vs-btn-search:hover {
            background: var(--color-primary);
            color: var(--color-white);
        }

        .vs-mega-menu--contact {
            width: 480px;
            left: -30px;
            min-height: 280px;
        }

        .vs-mega-menu--contact .vs-mega-sidebar {
            width: 180px;
        }

        .vs-mega-menu--contact .vs-mega-grid-v2 {
            grid-template-columns: 1fr;
        }

        /* Page Specific */
        .contact-section {
            padding: 100px 0;
            background: #f9f9f9;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: stretch;
        }

        .contact-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .contact-info-item {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .contact-info-item i {
            font-size: 24px;
            color: var(--color-primary);
        }

        .contact-info-item div h4 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        .contact-info-item div p {
            color: #666;
            line-height: 1.6;
        }

        .map-box {
            background: #eee;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #ddd;
            min-height: 300px;
        }

        /* 移动端适配 - 平板及以下 */
        @media screen and (max-width: 1024px) {
            main {
                padding-top: 0 !important;
            }

            .vs-hero {
                padding-top: 70px !important;
                height: 40vh !important;
            }

            .contact-section {
                padding: 60px 0;
            }

            .vs-hero h1 {
                font-size: 32px !important;
            }

            .vs-hero p {
                font-size: 14px !important;
            }

            .contact-grid {
                grid-template-columns: 1fr !important;
                gap: 30px !important;
            }

            .contact-card {
                padding: 24px !important;
            }

            .contact-info-item {
                flex-direction: column;
                gap: 12px;
                margin-bottom: 24px;
            }

            .contact-info-item i {
                font-size: 20px;
            }

            .contact-info-item div h4 {
                font-size: 16px;
            }

            .contact-info-item div p {
                font-size: 14px;
            }

            .map-box {
                min-height: 250px;
            }

            .vs-mega-menu {
                display: none !important;
            }
        }

        /* 手机竖屏 */
        @media screen and (max-width: 768px) {
            main {
                padding-top: 0 !important;
            }

            .vs-hero {
                padding-top: 70px !important;
            }

            .vs-hero h1 {
                font-size: 28px !important;
            }

            .contact-grid {
                gap: 20px !important;
            }

            .contact-card {
                padding: 20px !important;
            }
        }

        /* 小屏幕手机 */
        @media screen and (max-width: 480px) {
            .contact-section {
                padding: 40px 0;
            }

            .vs-hero h1 {
                font-size: 24px !important;
            }

            .contact-card {
                padding: 16px !important;
            }

            .contact-info-item {
                margin-bottom: 16px;
            }

            .map-box {
                min-height: 200px;
            }
        }
    </style>

            <!-- 视频背景 -->
            <video id="heroVideo" muted playsinline preload="metadata" poster="contact_hero_bg.png"
                style="position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.8s ease;">
                <source src="/cdn_assets/videos/renwen.mp4" type="video/mp4" />
            </video>
            <script>
                (function () {
                    const video = document.getElementById('heroVideo');
                    const loader = document.getElementById('heroLoader');
                    let playAttempted = false;

                    function tryPlay() {
                        if (playAttempted) return;
                        playAttempted = true;

                        video.play().then(() => {
                            video.style.opacity = '0.6';
                            if (loader) loader.style.display = 'none';
                        }).catch(() => {
                            video.style.opacity = '0.6';
                            if (loader) loader.style.display = 'none';
                        });
                    }

                    video.addEventListener('canplay', tryPlay);
                    video.addEventListener('loadeddata', tryPlay);

                    // 超时后尝试播放或显示 poster
                    setTimeout(() => {
                        if (!playAttempted) {
                            tryPlay();
                        }
                    }, 3000);
                })();
            </script>
