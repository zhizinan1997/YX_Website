<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线留言 - 元芯传感</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            padding: 0;
        }
        .feedback-form {
            max-width: 100%;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
        }
        .form-group.full {
            flex: none;
            width: 100%;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        .form-group label .required {
            color: #dc3545;
            margin-left: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #003366;
            box-shadow: 0 0 0 3px rgba(0,51,102,0.1);
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .form-group input.error,
        .form-group textarea.error {
            border-color: #dc3545;
        }
        .error-msg {
            color: #dc3545;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }
        .btn-row {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-submit {
            padding: 16px 40px;
            background: linear-gradient(135deg, #003366 0%, #001f3f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,51,102,0.3);
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-reset {
            padding: 16px 40px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-reset:hover {
            background: #e0e0e0;
        }
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .rate-limit-msg {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
    </style>
  <!-- Site Search -->
  <link rel="stylesheet" href="../../assets/css/search.css">
</head>
<body>
    <div id="successMsg" class="success-msg">
        <i class="fas fa-check-circle"></i> 留言提交成功！我们会尽快回复您。
    </div>
    <div id="rateLimitMsg" class="rate-limit-msg">
        提交过于频繁，请稍后再试。
    </div>
    
    <form id="feedbackForm" class="feedback-form">
        <div class="form-row">
            <div class="form-group">
                <label>您的姓名</label>
                <input type="text" id="txtUserName" name="txtUserName" placeholder="请输入您的姓名（选填）">
            </div>
            <div class="form-group">
                <label>联系电话 <span class="required">*</span></label>
                <input type="tel" id="txtUserTel" name="txtUserTel" placeholder="请输入您的电话" required>
                <p class="error-msg" id="phoneError">请填写联系电话</p>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>电子邮箱</label>
                <input type="email" id="txtUserEmail" name="txtUserEmail" placeholder="请输入您的邮箱（选填）">
            </div>
            <div class="form-group">
                <label>联系QQ</label>
                <input type="text" id="txtUserQQ" name="txtUserQQ" placeholder="请输入您的QQ（选填）">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group full">
                <label>留言标题</label>
                <input type="text" id="txtTitle" name="txtTitle" placeholder="请输入留言标题（选填）">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group full">
                <label>留言内容 <span class="required">*</span></label>
                <textarea id="txtContent" name="txtContent" placeholder="请输入您要咨询的内容..." required></textarea>
                <p class="error-msg" id="contentError">请填写留言内容</p>
            </div>
        </div>
        
        <div class="btn-row">
            <button type="submit" class="btn-submit" id="btnSubmit">提交留言</button>
            <button type="button" class="btn-reset" id="btnReset">重置</button>
        </div>
    </form>

    <script src="../../assets/js/public-turnstile.js"></script>
    <script>
        const form = document.getElementById('feedbackForm');
        const phoneInput = document.getElementById('txtUserTel');
        const contentInput = document.getElementById('txtContent');
        const phoneError = document.getElementById('phoneError');
        const contentError = document.getElementById('contentError');
        const submitBtn = document.getElementById('btnSubmit');
        const successMsg = document.getElementById('successMsg');
        const rateLimitMsg = document.getElementById('rateLimitMsg');
        const turnstileGuard = window.createPublicTurnstileGuard ? window.createPublicTurnstileGuard({
            form,
            mountBefore: document.querySelector('.btn-row')
        }) : null;

        if (turnstileGuard) {
            turnstileGuard.ensureReady();
        }

        // Reset button
        document.getElementById('btnReset').addEventListener('click', function() {
            form.reset();
            phoneInput.classList.remove('error');
            contentInput.classList.remove('error');
            phoneError.style.display = 'none';
            contentError.style.display = 'none';
        });

        // Form submit
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate
            let valid = true;
            
            if (!phoneInput.value.trim()) {
                phoneInput.classList.add('error');
                phoneError.style.display = 'block';
                valid = false;
            } else {
                phoneInput.classList.remove('error');
                phoneError.style.display = 'none';
            }
            
            if (!contentInput.value.trim()) {
                contentInput.classList.add('error');
                contentError.style.display = 'block';
                valid = false;
            } else {
                contentInput.classList.remove('error');
                contentError.style.display = 'none';
            }
            
            if (!valid) return;
            
            // Submit
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            
            try {
                const formData = new FormData(form);
                if (turnstileGuard) {
                    await turnstileGuard.decoratePayload(formData);
                }
                const res = await fetch('/api/feedback', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                if (data.success) {
                    form.style.display = 'none';
                    successMsg.style.display = 'block';
                } else if (res.status === 429) {
                    form.style.display = 'none';
                    rateLimitMsg.style.display = 'block';
                } else {
                    alert(data.message || '提交失败，请重试');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交留言';
                }
            } catch (err) {
                alert('网络错误，请重试');
                submitBtn.disabled = false;
                submitBtn.textContent = '提交留言';
            } finally {
                if (turnstileGuard) {
                    turnstileGuard.reset();
                }
            }
        });

        // Remove error on input
        phoneInput.addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('error');
                phoneError.style.display = 'none';
            }
        });
        contentInput.addEventListener('input', function() {
            if (this.value.trim()) {
                this.classList.remove('error');
                contentError.style.display = 'none';
            }
        });
    </script>

  <!-- 全站搜索 -->
  <script src="../../assets/js/search.js"></script>

    <!-- AI智能客服 -->
    <script src="../../assets/js/chatbot.js"></script>

</html>
