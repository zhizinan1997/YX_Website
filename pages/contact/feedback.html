        .vs-nav__item--has-mega {

        .vs-mega-menu {

        .vs-mega-menu::before {

            top: -40px;
            left: -50px;
            width: 400px;
            height: 50px;
            background: transparent;
            z-index: -1;

        .vs-nav__item--has-mega:hover .vs-mega-menu {

            pointer-events: auto;
        }

    <script>
        (function () {
            const form = document.getElementById('feedbackForm');
            if (!form) return;
            const phoneInput = document.getElementById('txtUserTel');
            const contentInput = document.getElementById('txtContent');
            const phoneError = document.getElementById('phoneError');
            const contentError = document.getElementById('contentError');
            const submitBtn = document.getElementById('btnSubmit');
            const modal = document.getElementById('feedbackResultModal');
            const modalIcon = document.getElementById('feedbackResultIcon');
            const modalText = document.getElementById('feedbackResultText');
            const turnstileGuard = window.createPublicTurnstileGuard ? window.createPublicTurnstileGuard({
                form,
                mountBefore: document.querySelector('.btn-row')
            }) : null;
            let closeTimer = null;

            function openResultModal(ok, text) {
                if (closeTimer) clearTimeout(closeTimer);
                modalIcon.textContent = ok ? '✓' : '!';
                modalIcon.style.color = ok ? '#16a34a' : '#dc2626';
                modalText.textContent = text;
                modal.classList.add('show');
                modal.setAttribute('aria-hidden', 'false');
                closeTimer = setTimeout(() => {
                    modal.classList.remove('show');
                    modal.setAttribute('aria-hidden', 'true');
                }, 3000);
            }

            function clearValidationState() {
                phoneInput.classList.remove('error');
                contentInput.classList.remove('error');
                phoneError.style.display = 'none';
                contentError.style.display = 'none';
            }

            document.getElementById('btnReset').addEventListener('click', () => {
                form.reset();
                clearValidationState();
            });

            phoneInput.addEventListener('input', () => {
                if (phoneInput.value.trim()) {
                    phoneInput.classList.remove('error');
                    phoneError.style.display = 'none';
                }
            });

            contentInput.addEventListener('input', () => {
                if (contentInput.value.trim()) {
                    contentInput.classList.remove('error');
                    contentError.style.display = 'none';
                }
            });

            if (turnstileGuard) {
                turnstileGuard.ensureReady();
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearValidationState();

                let valid = true;
                if (!phoneInput.value.trim()) {
                    phoneInput.classList.add('error');
                    phoneError.style.display = 'block';
                    valid = false;
                }
                if (!contentInput.value.trim()) {
                    contentInput.classList.add('error');
                    contentError.style.display = 'block';
                    valid = false;
                }
                if (!valid) return;

                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';
                try {
                    const formData = new FormData(form);
                    if (turnstileGuard) {
                        await turnstileGuard.decoratePayload(formData);
                    }
                    const res = await fetch('/api/feedback', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.success) {
                        form.reset();
                        clearValidationState();
                        openResultModal(true, data.message || '留言提交成功！我们会尽快回复您。');
                    } else {
                        openResultModal(false, data.message || '提交失败，请稍后重试');
                    }
                } catch (err) {
                    openResultModal(false, '网络错误，请稍后重试');
                } finally {
                    if (turnstileGuard) {
                        turnstileGuard.reset();
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交留言';
                }
            });
        })();
    </script>
