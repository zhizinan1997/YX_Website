name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    name: Gemini AI Code Review

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          separator: ","
          files: |
            **/*.html
            **/*.css
            **/*.js
            **/*.py
            **/*.yml
            **/*.yaml
            **/*.json

      - name: Setup Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          pip install google-generativeai PyGithub

      - name: Run Gemini Code Review
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          python << 'EOF'
          import os
          import google.generativeai as genai
          from github import Github

          # 配置 Gemini
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          model = genai.GenerativeModel('gemini-2.0-flash')

          # 配置 GitHub
          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo(os.environ['REPO_NAME'])
          pr = repo.get_pull(int(os.environ['PR_NUMBER']))

          # 获取变更文件列表
          changed_files = os.environ['CHANGED_FILES'].split(',')
          changed_files = [f.strip() for f in changed_files if f.strip()]

          if not changed_files:
              print("No relevant files changed, skipping review.")
              exit(0)

          # 获取 PR 的 diff
          files = pr.get_files()
          
          review_parts = []
          for file in files:
              if file.filename in changed_files:
                  patch = file.patch if file.patch else "(No diff available)"
                  review_parts.append(f"### File: `{file.filename}`\n```diff\n{patch[:3000]}\n```")

          if not review_parts:
              print("No patches to review.")
              exit(0)

          # 构建 Gemini 提示词
          prompt = f"""你是一位专业的代码审查员。请审查以下 Pull Request 的代码变更，并提供建设性的反馈。

          **PR 标题**: {pr.title}
          **PR 描述**: {pr.body or '无描述'}

          **代码变更**:
          {"".join(review_parts[:10])}

          请用中文进行审查，包括以下方面：
          1. 🐛 **潜在 Bug**: 可能导致问题的代码
          2. 🔒 **安全问题**: 安全漏洞或风险
          3. ⚡ **性能优化**: 性能改进建议
          4. 📝 **代码风格**: 代码可读性和规范性
          5. ✅ **优点**: 代码中做得好的地方

          请以 Markdown 格式输出审查结果，简洁明了。如果代码质量很好，也请给予肯定。
          """

          # 调用 Gemini API
          response = model.generate_content(prompt)
          review_comment = response.text

          # 发表评论到 PR
          comment_body = f"""## 🤖 Gemini AI 代码审查

          {review_comment}

          ---
          *此审查由 Gemini AI 自动生成，仅供参考。*
          """

          pr.create_issue_comment(comment_body)
          print("✅ Gemini review comment posted successfully!")
          EOF

      - name: No files to review
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No relevant files changed, skipping Gemini review."
