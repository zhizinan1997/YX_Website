name: Build and Push Docker Images

on:
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  WEBSITE_IMAGE: ${{ github.repository }}

jobs:
  build-and-push:
    # 只处理主站发布（v4.9.0 这类）。桌面客户端用 desktop-v* 标签，必须排除，
    # 否则会把主站镜像打成桌面版本号并覆盖 latest 标签。
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for website image
        id: meta_website
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEBSITE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push website image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_website.outputs.tags }}
          labels: ${{ steps.meta_website.outputs.labels }}
