name: Build Desktop Client

# 桌面客户端（desktop/）的 Windows 安装包构建。
#
# 触发方式与标签约定：
#   - 主站发布 v4.9.0 这类标签：docker-publish.yml 构建镜像，本工作流同时构建
#     exe 安装包挂到同一个 Release，桌面端版本号跟随标签（v4.9.0 → 4.9.0）；
#   - 仅桌面外壳自身改动时，可用 desktop-v0.1.0 这类标签单独发桌面版；
#   - docker-publish.yml 只认 v 前缀，desktop-v* 标签不会触发镜像构建。
# 也支持手动触发，便于在正式发版前验证构建。
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-desktop:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 从标签同步版本号
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          # v4.9.0 与 desktop-v0.1.0 两种前缀都支持，桌面端版本号跟随标签
          $version = $tag -replace '^(desktop-)?v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.\-]+)?$') {
            # 从分支手动触发（发版前验证构建）没有版本号可同步，按仓库当前版本构建
            if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
              Write-Host "引用 $tag 不是版本号，跳过版本号同步"
              exit 0
            }
            throw "标签必须是 v 或 desktop-v 加 <major>.<minor>.<patch> 的形式，当前为：$tag"
          }

          # tauri.conf.json 里 productName 是中文（决定安装包文件名与快捷方式名），
          # 所以读写都显式走无 BOM 的 UTF-8，不吃 PowerShell 版本的默认编码差异
          # （PS5 的 Get-Content 默认按 ANSI 读，会把中文读成乱码）。
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $confPath = 'desktop/src-tauri/tauri.conf.json'
          $conf = [System.IO.File]::ReadAllText($confPath, $utf8)
          # 用实例方法按 count 替换：静态 [regex]::Replace 的第四个位置参数是
          # RegexOptions 而非 count，传 1 会被当成 IgnoreCase 并替换全部匹配。
          $conf = ([regex]'"version":\s*"[^"]+"').Replace($conf, "`"version`": `"$version`"", 1)
          [System.IO.File]::WriteAllText($confPath, $conf, $utf8)

          $cargoPath = 'desktop/src-tauri/Cargo.toml'
          $cargo = [System.IO.File]::ReadAllText($cargoPath, $utf8)
          $cargo = ([regex]'(?m)^version = "[^"]+"').Replace($cargo, "version = `"$version`"", 1)
          [System.IO.File]::WriteAllText($cargoPath, $cargo, $utf8)

          Write-Host "桌面客户端版本已同步为 $version"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 构建并上传安装包
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}

      # 手动触发只做构建验证，不发布任何产物。
      - name: 仅构建（手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
