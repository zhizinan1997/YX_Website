<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Metachip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            padding: 0;
        }

        .feedback-form {
            max-width: 100%;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        .form-group.full {
            flex: none;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        .form-group label .required {
            color: #dc3545;
            margin-left: 4px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #003366;
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input.error,
        .form-group textarea.error {
            border-color: #dc3545;
        }

        .error-msg {
            color: #dc3545;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .btn-row {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-submit {
            padding: 16px 40px;
            background: linear-gradient(135deg, #003366 0%, #001f3f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 51, 102, 0.3);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-reset {
            padding: 16px 40px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .rate-limit-msg {
            background: #fff3cd;
            color: #856404;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
    </style>
    <!-- Site Search -->
    <link rel="stylesheet" href="../../assets/css/search.css">
</head>

<body>
    <div id="successMsg" class="success-msg">
        <i class="fas fa-check-circle"></i> Message submitted successfully! We will get back to you as soon as possible.
    </div>
    <div id="rateLimitMsg" class="rate-limit-msg">
        Submissions are too frequent, please try again later.
    </div>

    <form id="feedbackForm" class="feedback-form">
        <div class="form-row">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="txtUserName" name="txtUserName" placeholder="Enter your name (optional)">
            </div>
            <div class="form-group">
                <label>Contact Phone <span class="required">*</span></label>
                <input type="tel" id="txtUserTel" name="txtUserTel" placeholder="Enter your phone number" required>
                <p class="error-msg" id="phoneError">Please fill in your contact phone</p>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="txtUserEmail" name="txtUserEmail" placeholder="Enter your email (optional)">
            </div>
            <div class="form-group">
                <label>QQ</label>
                <input type="text" id="txtUserQQ" name="txtUserQQ" placeholder="Enter your QQ (optional)">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group full">
                <label>Topic</label>
                <input type="text" id="txtTitle" name="txtTitle" placeholder="Enter message topic (optional)">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group full">
                <label>Message <span class="required">*</span></label>
                <textarea id="txtContent" name="txtContent" placeholder="Enter the content you want to inquire about..."
                    required></textarea>
                <p class="error-msg" id="contentError">Please fill in the message content</p>
            </div>
        </div>

        <div class="btn-row">
            <button type="submit" class="btn-submit" id="btnSubmit">Submit</button>
            <button type="button" class="btn-reset" id="btnReset">Reset</button>
        </div>
    </form>

    <script>
        const form = document.getElementById('feedbackForm');
        const phoneInput = document.getElementById('txtUserTel');
        const contentInput = document.getElementById('txtContent');
        const phoneError = document.getElementById('phoneError');
        const contentError = document.getElementById('contentError');
        const submitBtn = document.getElementById('btnSubmit');
        const successMsg = document.getElementById('successMsg');
        const rateLimitMsg = document.getElementById('rateLimitMsg');

        // Reset button
        document.getElementById('btnReset').addEventListener('click', function () {
            form.reset();
            phoneInput.classList.remove('error');
            contentInput.classList.remove('error');
            phoneError.style.display = 'none';
            contentError.style.display = 'none';
        });

        // Form submit
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Validate
            let valid = true;

            if (!phoneInput.value.trim()) {
                phoneInput.classList.add('error');
                phoneError.style.display = 'block';
                valid = false;
            } else {
                phoneInput.classList.remove('error');
                phoneError.style.display = 'none';
            }

            if (!contentInput.value.trim()) {
                contentInput.classList.add('error');
                contentError.style.display = 'block';
                valid = false;
            } else {
                contentInput.classList.remove('error');
                contentError.style.display = 'none';
            }

            if (!valid) return;

            // Submit
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const formData = new FormData(form);
                const res = await fetch('/api/feedback', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.success) {
                    form.style.display = 'none';
                    successMsg.style.display = 'block';
                } else if (res.status === 429) {
                    form.style.display = 'none';
                    rateLimitMsg.style.display = 'block';
                } else {
                    alert(data.message || 'Submission failed, please try again');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit';
                }
            } catch (err) {
                alert('Network error, please try again');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        });

        // Remove error on input
        phoneInput.addEventListener('input', function () {
            if (this.value.trim()) {
                this.classList.remove('error');
                phoneError.style.display = 'none';
            }
        });
        contentInput.addEventListener('input', function () {
            if (this.value.trim()) {
                this.classList.remove('error');
                contentError.style.display = 'none';
            }
        });
    </script>

    <!-- 全站搜索 -->
    <script src="../../assets/js/search.js"></script>

    <!-- AI智能客服 -->
    <script src="../../assets/js/chatbot.js"></script>

</body>

</html>
