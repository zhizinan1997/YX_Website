  <section class="vs-hero">
    <div class="vs-hero__media" id="heroMedia"></div>
    <style>
      .vs-hero {
        height: 100vh;
        min-height: 100vh;
      }

      @supports (height: 100svh) {
        .vs-hero {
          height: 100svh;
          min-height: 100svh;
        }
      }

      .vs-hero__media {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }

      .hero-slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1s ease;
        background-position: center;
        background-size: cover;
      }

      .hero-slide.is-active {
        opacity: 1;
      }

      .hero-slide picture,
      .hero-slide img,
      .hero-slide video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .hero-controls {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 6;
      }

      .hero-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .hero-dot.is-active {
        width: 16px;
        background: rgba(255, 255, 255, 0.95);
      }
    </style>
    <script>
      (function () {
        const container = document.getElementById('heroMedia');
        if (!container) return;
        const heroSection = container.closest('.vs-hero');

        const fallbackItems = [
          { type: 'image', url: 'assets/images/1zhen.jpg', source: 'fallback' }
        ];

        let items = [];
        let intervalSeconds = 5;
        let currentIndex = 0;
        let timer = null;
        let dots = [];
        let controls = null;
        let switching = false;

        function clearTimer() {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
        }

        function ensureSlideMedia(slide, eager) {
          if (!slide || slide.dataset.mediaReady === '1') return;
          const type = slide.dataset.type;
          const item = slide.__item || {};
          const url = item.url || slide.dataset.url;
          if (!url) return;

          if (type === 'video') {
            const video = document.createElement('video');
            video.src = url;
            video.muted = true;
            video.playsInline = true;
            video.preload = eager ? 'metadata' : 'none';
            video.loop = true;
            slide.appendChild(video);
          } else {
            const picture = document.createElement('picture');
            const sources = Array.isArray(item.sources) ? item.sources : [];
            sources.forEach(sourceDef => {
              if (!sourceDef || !sourceDef.srcset) return;
              const source = document.createElement('source');
              source.srcset = sourceDef.srcset;
              if (sourceDef.type) source.type = sourceDef.type;
              if (sourceDef.sizes) source.sizes = sourceDef.sizes;
              picture.appendChild(source);
            });

            const img = document.createElement('img');
            img.src = item.fallback || url;
            img.alt = '';
            img.decoding = 'async';
            // Carousel slides should preload in advance; lazy can delay off-screen slide fetch.
            img.loading = 'eager';
            img.fetchPriority = eager ? 'high' : 'low';
            if (item.width) img.width = Number(item.width) || 0;
            if (item.height) img.height = Number(item.height) || 0;
            picture.appendChild(img);
            slide.appendChild(picture);
          }

          slide.dataset.mediaReady = '1';
        }

        function warmNextSlide(slides, index) {
          if (!slides.length) return;
          const next = slides[(index + 1) % slides.length];
          ensureSlideMedia(next, false);
        }

        function waitForImageReady(slide, timeoutMs) {
          return new Promise(resolve => {
            const img = slide ? slide.querySelector('img') : null;
            if (!img) {
              resolve(true);
              return;
            }
            if (img.complete && img.naturalWidth > 0) {
              resolve(true);
              return;
            }
            let done = false;
            const finish = (ok) => {
              if (done) return;
              done = true;
              clearTimeout(timerId);
              resolve(ok);
            };
            const timerId = setTimeout(() => finish(false), timeoutMs);
            img.addEventListener('load', () => finish(true), { once: true });
            img.addEventListener('error', () => finish(false), { once: true });
          });
        }

        function waitForVideoReady(slide, timeoutMs) {
          return new Promise(resolve => {
            const vid = slide ? slide.querySelector('video') : null;
            if (!vid) {
              resolve(true);
              return;
            }
            if (vid.readyState >= 2) {
              resolve(true);
              return;
            }
            let done = false;
            const finish = (ok) => {
              if (done) return;
              done = true;
              clearTimeout(timerId);
              resolve(ok);
            };
            const timerId = setTimeout(() => finish(false), timeoutMs);
            vid.addEventListener('canplay', () => finish(true), { once: true });
            vid.addEventListener('error', () => finish(false), { once: true });
          });
        }

        function waitForSlideReady(slide, timeoutMs = 8000) {
          if (!slide) return Promise.resolve(false);
          const type = slide.dataset.type;
          if (type === 'video') return waitForVideoReady(slide, timeoutMs);
          return waitForImageReady(slide, timeoutMs);
        }

        function buildSlides(list) {
          container.innerHTML = '';
          list.forEach((item, index) => {
            const slide = document.createElement('div');
            slide.className = 'hero-slide' + (index === 0 ? ' is-active' : '');
            slide.dataset.index = String(index);
            slide.dataset.type = item.type;
            slide.dataset.url = item.url;
            slide.__item = item;
            if (index === 0) {
              ensureSlideMedia(slide, true);
            }
            container.appendChild(slide);
          });
        }

        function activateSlide(index) {
          const slides = Array.from(container.querySelectorAll('.hero-slide'));
          if (slides.length === 0) return;

          const active = slides[index];
          if (!active) return;
          ensureSlideMedia(active, true);

          slides.forEach(slide => slide.classList.remove('is-active'));
          active.classList.add('is-active');

          const type = active.dataset.type;
          clearTimer();

          slides.forEach(slide => {
            const vid = slide.querySelector('video');
            if (vid) {
              vid.pause();
              vid.currentTime = 0;
            }
          });

          if (type === 'video') {
            const vid = active.querySelector('video');
            if (vid) {
              vid.play().catch(() => { });
            }
          } else {
            timer = setTimeout(goNext, intervalSeconds * 1000);
          }

          warmNextSlide(slides, index);
          updateDots();
        }

        async function goNext() {
          if (switching || !items.length) return;
          switching = true;
          try {
            const slides = Array.from(container.querySelectorAll('.hero-slide'));
            if (!slides.length) return;
            const nextIndex = (currentIndex + 1) % items.length;
            const nextSlide = slides[nextIndex];
            if (!nextSlide) return;

            ensureSlideMedia(nextSlide, true);
            const ready = await waitForSlideReady(nextSlide, 9000);
            if (!ready) {
              // Keep current slide visible and retry later if next media is still not ready.
              timer = setTimeout(goNext, 900);
              return;
            }

            currentIndex = nextIndex;
            activateSlide(currentIndex);
          } finally {
            switching = false;
          }
        }

        function buildControls() {
          if (!heroSection) return;
          if (controls) controls.remove();

          controls = document.createElement('div');
          controls.className = 'hero-controls';
          dots = items.map((_, idx) => {
            const dot = document.createElement('button');
            dot.className = 'hero-dot' + (idx === 0 ? ' is-active' : '');
            dot.addEventListener('click', () => {
              currentIndex = idx;
              activateSlide(currentIndex);
            });
            controls.appendChild(dot);
            return dot;
          });

          heroSection.appendChild(controls);
        }

        function updateDots() {
          if (!dots || dots.length === 0) return;
          dots.forEach((dot, idx) => {
            if (idx === currentIndex) {
              dot.classList.add('is-active');
            } else {
              dot.classList.remove('is-active');
            }
          });
        }

        function startCarousel(config) {
          items = (config.items || []).filter(i => i && i.url);
          intervalSeconds = parseInt(config.interval_seconds, 10) || 5;
          if (items.length === 0) items = fallbackItems;

          buildSlides(items);
          buildControls();
          currentIndex = 0;
          activateSlide(currentIndex);
        }

        // Paint first frame immediately, then replace with real config.
        startCarousel({ items: fallbackItems, interval_seconds: 5 });
        fetch('/api/hero')
          .then(res => res.json())
          .then(startCarousel)
          .catch(() => { });
      })();
    </script>

  <script>
    (function () {
      const sectionEl = document.getElementById('partnersSection');
      const track = document.getElementById('partnersTrack');
      if (!track) return;

      function buildLogos(items) {
        track.innerHTML = '';
        const logos = items.map(item => `
          <div class="vs-partners__logo">
            <img src="${item.url}" alt="合作伙伴">
          </div>
        `).join('');

        track.innerHTML = logos + logos;

        const base = Math.max(90, items.length * 6);
        track.style.setProperty('--marquee-duration', `${base}s`);
      }

      fetch('/api/home/section-visibility')
        .then(res => res.json())
        .then(visibility => {
          if (visibility && visibility.partners === false) {
            if (sectionEl) sectionEl.style.display = 'none';
            return;
          }
          return fetch('/api/partners')
            .then(res => res.json())
            .then(data => {
              const items = (data.items || []).filter(i => i && i.url);
              if (items.length === 0) {
                track.innerHTML = '<div style="padding: 10px; color:#888; font-size: 13px;">暂无合作伙伴</div>';
                return;
              }
              buildLogos(items);
            });
        })
        .catch(() => {
          track.innerHTML = '<div style="padding: 10px; color:#888; font-size: 13px;">加载失败</div>';
        });
    })();
  </script>

    <script>
      (function () {
        const sectionEl = document.getElementById('latestNewsSection');
        const grid = document.getElementById('latestNewsGrid');
        if (!grid) return;

        function render(items) {
          if (!items || items.length === 0) {
            grid.innerHTML = '<div class="vs-latest-news__empty">暂无资讯</div>';
            return;
          }

          const categoryLabels = {
            enterprise: '新闻',
            industry: '应用',
            science: '洞察'
          };

          function formatNewsDate(dateText) {
            if (!dateText) return '';
            const match = String(dateText).match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!match) return String(dateText);
            return `${parseInt(match[3], 10)} ${parseInt(match[2], 10)}月 ${match[1]}`;
          }

          grid.innerHTML = items.map(item => `
            <a href="${item.link}" class="vs-latest-news__item">
              <div class="vs-latest-news__img">
                <img src="${item.image || ''}" alt="News">
                <span class="vs-latest-news__badge">${categoryLabels[item.category] || '新闻'}</span>
              </div>
              <span class="vs-latest-news__date">${formatNewsDate(item.date)}</span>
              <h3 class="vs-latest-news__item-title">${item.title || ''}</h3>
              <p class="vs-latest-news__desc">${item.desc || ''}</p>

                <span class="vs-latest-news__arrow" aria-hidden="true"><i class="fas fa-arrow-right"></i></span>
              </div>
            </a>
          `).join('');
        }

  <script>
    (function () {
      function runWhenIdle(task) {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(task, { timeout: 3000 });
        } else {
          setTimeout(task, 300);
        }
      }

      function preloadImage(url) {
        return new Promise(resolve => {
          if (!url) {
            resolve();
            return;
          }
          const img = new Image();
          img.onload = () => resolve();
          img.onerror = () => resolve();
          img.src = url;
          if (img.complete) resolve();
        });
      }

      async function waitHomeHeroImagesReady() {
        try {
          const res = await fetch('/api/hero');
          const data = await res.json();
          const imageUrls = (data.items || [])
            .filter(item => item && item.type === 'image' && item.url)
            .map(item => item.url);
          if (imageUrls.length <= 1) return;

          // Warm only the next couple slides, avoid downloading all hero images at once.
          const warmQueue = imageUrls.slice(1, 3);
          for (const url of warmQueue) {
            await preloadImage(url);
          }
        } catch (_) {
          // Silently ignore: prefetch is best effort.
        }
      }

      async function prefetchH2Videos() {
        function toVideoFetchUrl(rawUrl) {
          const absolute = new URL(rawUrl, window.location.origin);
          if (absolute.origin === window.location.origin) return absolute.href;
          return `${window.location.origin}/api/video-proxy?url=${encodeURIComponent(absolute.href)}`;
        }
        try {
          const res = await fetch('/api/h2-home');
          const data = await res.json();
          const urls = (data.items || [])
            .map(item => item && item.url)
            .filter(Boolean)
            .map(toVideoFetchUrl)
            .slice(0, 1);
          if (!urls.length) return;

          for (const url of urls) {
            try {
              // Warm startup with a small byte range instead of downloading full video files.
              await fetch(url, {
                credentials: 'same-origin',
                headers: { Range: 'bytes=0-524287' }
              });
            } catch (_) {
              // Ignore single file failure.
            }
          }
        } catch (_) {
          // Silently ignore: prefetch is best effort.
        }
      }

      window.addEventListener('load', () => {
        runWhenIdle(async () => {
          await waitHomeHeroImagesReady();
          await prefetchH2Videos();
        });
      });
    })();
  </script>
