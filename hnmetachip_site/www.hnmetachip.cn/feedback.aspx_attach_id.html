<body>

    <div class="ny_ly">

        <form id="feedback_form" name="feedback_form" url="/plugins/feedback/ajax.ashx?action=add&site=1&pageurl=">
            <div class="mes_form">
                <div class="mes_form_l">
                    <p><input type="text" id="txtUserName" name="txtUserName" datatype="*2-20" sucmsg=" " placeholder="您的姓名：" /></p>

                    <p><input type="text" id="txtUserTel" name="txtUserTel" datatype="*5-20" sucmsg=" " placeholder="联系电话：" /></p>
                    <p><input type="text" id="txtUserEmail" name="txtUserEmail" datatype="*0-76" sucmsg=" " placeholder="电子邮箱：" /></p>
                    <p><input type="text" id="txtUserQQ" name="txtUserQQ" datatype="*0-20" sucmsg=" " placeholder="联系QQ：" /></p>
                    <p><input type="text" id="txtTitle" name="txtTitle" datatype="*2-100" sucmsg=" " placeholder="留言标题：" /></p>
                </div>
                <div class="mes_form_r">
                    <textarea id="txtContent" name="txtContent" datatype="*2-250" sucmsg=" " placeholder="留言内容："></textarea>
                    <div class="mes_form_p">
                        <p><input type="text" id="txtCode" name="txtCode" datatype="*" sucmsg=" " placeholder="验证码：" /></p>
                        <a href="javascript:;" onclick="ToggleCode(this, '/tools/verify_code.ashx');return false;"><img src="tools/verify_code.ashx" width="80" height="22" align="absmiddle" /> 看不清楚？</a>
                    </div>
                    <input id="txtProvince" name="txtProvince" type="hidden" class="input txt" />
                    <input id="txtCity" name="txtCity" type="hidden" class="input txt" />
                    <input id="txtIsCode" name="txtIsCode" type="hidden" value="1" />
                    <input id="hfAttachId" name="hfAttachId" type="hidden" value="" />
                </div>
                <span class="Validform_checktip"></span>
                <div class="feedback_line"></div>
				<div class="clearfix"></div>
				
				<div class="ysxy">
					<input type="checkbox" class="ysxy_click"/> <span>我已阅读并同意 <a href="policy.aspx.html" target="_black">《隐私协议》</a></span>
				</div>
				
				
                <input class="mes_form_tj" type="submit" id="btnSubmit" name="btnSubmit" value="提交" disabled/>
                <input type="button" value="重置" id="btnCancel" class="mes_form_cz" />
                <!--<input class="mes_form_cz" >重置</button>-->
            </div>
        </form>

        <script type="text/javascript">

            $("#btnCancel").bind("click", function () {

                $("#txtUserName").val('');
                $("#txtUserTel").val('');
                $("#txtUserEmail").val('');
                $("#txtUserQQ").val('');
                $("#txtTitle").val('');
                $("#txtContent").val('');

            });
			
			
			$(".ysxy_click").click(function(){
				if($(this).is(":checked")){
					$(".mes_form_tj").prop("disabled",false)
					$(".mes_form_tj").css("background","#ff0101")
					
				}else{
					$(".mes_form_tj").prop("disabled",true)
					$(".mes_form_tj").css("background","#a0a0a0")
				}	
			})
			
        </script>

        <div class="clearfix"></div>

    </div>
